<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Defender 3D — Cosmic Battle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        #canvas { display: block; }
        #hud {
            position: fixed;
            top: 15px; left: 15px;
            color: #0ff;
            font-size: 16px;
            text-shadow: 0 0 10px #0ff;
            z-index: 100;
            pointer-events: none;
        }
        #score { font-size: 28px; font-weight: bold; color: #ff0; text-shadow: 0 0 15px #ff0; }
        #hp { color: #f44; margin-top: 8px; font-size: 18px; }
        #wave { color: #4af; margin-top: 5px; font-size: 14px; }
        #game-over {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 36px;
            text-align: center;
            z-index: 200;
            display: none;
            text-shadow: 0 0 20px #f00;
            pointer-events: none;
        }
        #restart-btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 20px;
            background: #f44;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            font-weight: bold;
            box-shadow: 0 0 15px #f44;
        }
        #restart-btn:hover { background: #ff6; color: #000; }
        #instructions {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: rgba(0, 255, 204, 0.7);
            font-size: 12px;
            text-shadow: 0 0 5px #0fc;
            z-index: 100;
            text-align: right;
        }
        @media (max-width: 768px) {
            #score { font-size: 20px; }
            #hud { font-size: 14px; }
            #game-over { font-size: 24px; }
            #instructions { font-size: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="hp">❤️ ❤️ ❤️</div>
        <div id="wave">WAVE: 1</div>
    </div>
    <div id="game-over">
        GAME OVER<br>
        <span style="font-size: 18px; color: #aaa;">Final Score: <span id="final-score">0</span></span>
        <button id="restart-btn">RESTART</button>
    </div>
    <div id="instructions">
        WASD / Arrows — Move<br>
        SPACE / Click — Shoot<br>
        Mobile: Tilt to move, Tap to shoot
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000011, 50, 200);
        scene.background = new THREE.Color(0x000011);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffff, 1, 100);
        pointLight.position.set(0, 0, 5);
        pointLight.castShadow = true;
        scene.add(pointLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Stars background
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.8 });
        const starsVertices = [];
        for (let i = 0; i < 1500; i++) {
            starsVertices.push(
                (Math.random() - 0.5) * 400,
                (Math.random() - 0.5) * 400,
                (Math.random() - 0.5) * 400
            );
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Player ship
        const shipGroup = new THREE.Group();
        const bodyGeometry = new THREE.ConeGeometry(0.5, 1.5, 8);
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.3 });
        const shipBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
        shipBody.rotation.x = Math.PI / 2;
        shipBody.castShadow = true;
        shipGroup.add(shipBody);

        const cockpitGeometry = new THREE.SphereGeometry(0.25, 16, 16);
        const cockpitMaterial = new THREE.MeshStandardMaterial({ color: 0xff0, emissive: 0xff0, emissiveIntensity: 0.5 });
        const cockpit = new THREE.Mesh(cockpitGeometry, cockpitMaterial);
        cockpit.position.set(0, 0.2, 0);
        shipGroup.add(cockpit);

        const wingGeometry = new THREE.BoxGeometry(1.2, 0.05, 0.4);
        const wingMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.2 });
        const leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
        leftWing.position.set(-0.8, 0, -0.3);
        shipGroup.add(leftWing);

        const rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
        rightWing.position.set(0.8, 0, -0.3);
        shipGroup.add(rightWing);

        shipGroup.position.set(0, 0, 0);
        scene.add(shipGroup);

        // Enemy ships
        class Enemy {
            constructor() {
                const geometry = new THREE.OctahedronGeometry(0.4);
                const material = new THREE.MeshStandardMaterial({ color: 0xff0044, emissive: 0xff0044, emissiveIntensity: 0.3 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.reset();
                scene.add(this.mesh);
            }
            reset() {
                this.mesh.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 10,
                    -50 - Math.random() * 30
                );
                this.speed = 0.3 + Math.random() * 0.4;
                this.alive = true;
            }
            update() {
                if (!this.alive) return;
                this.mesh.position.z += this.speed;
                this.mesh.rotation.x += 0.02;
                this.mesh.rotation.y += 0.02;
                if (this.mesh.position.z > 10) {
                    this.alive = false;
                    scene.remove(this.mesh);
                }
            }
        }

        // Bullets
        class Bullet {
            constructor(x, y, z) {
                const geometry = new THREE.CylinderGeometry(0.05, 0.05, 1, 6);
                const material = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.8 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, y, z);
                this.mesh.rotation.x = Math.PI / 2;
                this.speed = 0.8;
                scene.add(this.mesh);
            }
            update() {
                this.mesh.position.z -= this.speed;
                return this.mesh.position.z > -100;
            }
        }

        // Particles (explosions)
        const particles = [];
        function createExplosion(x, y, z) {
            for (let i = 0; i < 15; i++) {
                const geometry = new THREE.SphereGeometry(0.05, 4, 4);
                const material = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 1 });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.set(x, y, z);
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2
                );
                particle.life = 1.0;
                particles.push(particle);
                scene.add(particle);
            }
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.velocity);
                p.life -= 0.02;
                p.material.opacity = p.life;
                p.scale.set(p.life, p.life, p.life);
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        // Game state
        let gameState = {
            score: 0,
            health: 3,
            wave: 1,
            enemies: [],
            bullets: [],
            gameOver: false,
            lastShot: 0,
            shotCooldown: 200,
            enemiesPerWave: 10,
            enemiesSpawned: 0,
            enemySpawnTimer: 0,
            enemySpawnInterval: 2000,
            invulnerable: false,
            invulnerableTime: 0
        };

        // Audio context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContext ? new AudioContext() : null;
        function playSound(freq, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);
            osc.start();
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        // Input
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mobile
        const touches = {};
        window.addEventListener('touchstart', e => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                touches[e.touches[i].identifier] = { x: e.touches[i].clientX, y: e.touches[i].clientY, startX: e.touches[i].clientX, startY: e.touches[i].clientY };
            }
            if (!gameState.gameOver) {
                gameState.lastShot = Date.now() - gameState.shotCooldown;
            }
        });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                if (touches[e.touches[i].identifier]) {
                    touches[e.touches[i].identifier].x = e.touches[i].clientX;
                    touches[e.touches[i].identifier].y = e.touches[i].clientY;
                }
            }
        });
        window.addEventListener('touchend', e => {
            for (let i = 0; i < e.changedTouches.length; i++) delete touches[e.changedTouches[i].identifier];
        });

        // Restart
        document.getElementById('restart-btn').addEventListener('click', () => {
            gameState = {
                score: 0, health: 3, wave: 1, enemies: [], bullets: [], gameOver: false,
                lastShot: 0, shotCooldown: 200, enemiesPerWave: 10, enemiesSpawned: 0,
                enemySpawnTimer: 0, enemySpawnInterval: 2000, invulnerable: false, invulnerableTime: 0
            };
            for (let e of gameState.enemies) scene.remove(e.mesh);
            scene.remove(shipGroup);
            shipGroup.position.set(0, 0, 0);
            scene.add(shipGroup);
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').textContent = 'SCORE: 0';
            document.getElementById('hp').textContent = '❤️ ❤️ ❤️';
            document.getElementById('wave').textContent = 'WAVE: 1';
        });

        function updateHUD() {
            document.getElementById('score').textContent = `SCORE: ${gameState.score}`;
            document.getElementById('hp').textContent = '❤️ '.repeat(gameState.health).trim() || '💀';
            document.getElementById('wave').textContent = `WAVE: ${gameState.wave}`;
        }

        function gameOver() {
            gameState.gameOver = true;
            document.getElementById('final-score').textContent = gameState.score;
            document.getElementById('game-over').style.display = 'block';
            playSound(200, 500);
        }

        // Game loop
        let lastTime = 0;
        function animate(time) {
            if (gameState.gameOver) { requestAnimationFrame(animate); renderer.render(scene, camera); return; }
            requestAnimationFrame(animate);
            const delta = time - lastTime;
            lastTime = time;

            // Ship movement
            const speed = 0.1;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) shipGroup.position.x -= speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) shipGroup.position.x += speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) shipGroup.position.y += speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) shipGroup.position.y -= speed;
            shipGroup.position.x = Math.max(-6, Math.min(6, shipGroup.position.x));
            shipGroup.position.y = Math.max(-3, Math.min(3, shipGroup.position.y));

            // Shooting
            if ((keys[' '] || keys['Spacebar']) && time - gameState.lastShot > gameState.shotCooldown) {
                gameState.bullets.push(new Bullet(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z));
                gameState.lastShot = time;
                playSound(880, 100);
            }

            // Mobile shooting
            if (Date.now() - gameState.lastShot > gameState.shotCooldown && Object.keys(touches).length > 0) {
                gameState.bullets.push(new Bullet(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z));
                gameState.lastShot = Date.now();
                playSound(880, 100);
            }

            // Bullets
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                if (!gameState.bullets[i].update()) {
                    scene.remove(gameState.bullets[i].mesh);
                    gameState.bullets.splice(i, 1);
                }
            }

            // Spawn enemies
            gameState.enemySpawnTimer += delta;
            if (gameState.enemySpawnTimer > gameState.enemySpawnInterval && gameState.enemiesSpawned < gameState.enemiesPerWave) {
                gameState.enemies.push(new Enemy());
                gameState.enemiesSpawned++;
                gameState.enemySpawnTimer = 0;
            }

            // Update enemies
            let allDead = true;
            for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.enemies[i];
                if (!enemy.alive) continue;
                enemy.update();
                allDead = allDead && !enemy.alive;
                if (enemy.alive && !gameState.invulnerable) {
                    const dist = enemy.mesh.position.distanceTo(shipGroup.position);
                    if (dist < 1.2) {
                        createExplosion(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z);
                        enemy.alive = false;
                        scene.remove(enemy.mesh);
                        gameState.enemies.splice(i, 1);
                        gameState.health--;
                        updateHUD();
                        if (gameState.health <= 0) { gameOver(); return; }
                        playSound(150, 300);
                        gameState.invulnerable = true;
                        gameState.invulnerableTime = time;
                        continue;
                    }
                }
                // Bullets vs enemies
                for (let j = gameState.bullets.length - 1; j >= 0; j--) {
                    if (enemy.alive && gameState.bullets[j].mesh.position.distanceTo(enemy.mesh.position) < 0.6) {
                        createExplosion(enemy.mesh.position.x, enemy.mesh.position.y, enemy.mesh.position.z);
                        enemy.alive = false;
                        scene.remove(enemy.mesh);
                        scene.remove(gameState.bullets[j].mesh);
                        gameState.bullets.splice(j, 1);
                        gameState.enemies.splice(i, 1);
                        gameState.score += 10;
                        updateHUD();
                        playSound(440, 50);
                        break;
                    }
                }
            }

            // Invulnerability
            if (gameState.invulnerable) {
                if (time - gameState.invulnerableTime < 2000) {
                    shipGroup.visible = Math.floor(time / 100) % 2;
                } else {
                    gameState.invulnerable = false;
                    shipGroup.visible = true;
                }
            }

            // Next wave
            if (allDead && gameState.enemiesSpawned >= gameState.enemiesPerWave) {
                gameState.wave++;
                gameState.enemiesSpawned = 0;
                gameState.enemiesPerWave += 3;
                gameState.enemySpawnInterval = Math.max(500, gameState.enemySpawnInterval - 100);
                gameState.score += 100;
                updateHUD();
                playSound(880, 200);
            }

            // Mobile movement
            if (Object.keys(touches).length > 0) {
                const touch = touches[Object.keys(touches)[0]];
                if (touch) {
                    const dx = touch.x - touch.startX;
                    const dy = touch.y - touch.startY;
                    shipGroup.position.x = Math.max(-6, Math.min(6, dx * 0.02));
                    shipGroup.position.y = Math.max(-3, Math.min(3, dy * -0.02));
                }
            }

            updateParticles();
            stars.rotation.y += 0.0002;
            shipGroup.rotation.z = -shipGroup.position.x * 0.05;
            renderer.render(scene, camera);
        }

        updateHUD();
        animate(0);
    </script>
</body>
</html>
